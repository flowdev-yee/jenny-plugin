import com.github.spotbugs.snom.SpotBugsTask
import java.text.SimpleDateFormat

plugins {
    id 'java'
    id 'checkstyle'
    id 'com.github.spotbugs' version '6.5.0'
    id 'com.gradleup.shadow' version '9.4.1'
}

group = "com.crimsonwarpedcraft.exampleplugin"

// -------------------- VERSIONING --------------------

static def getTime() {
    SimpleDateFormat sdf = new SimpleDateFormat("yyMMdd-HHmm")
    sdf.setTimeZone(TimeZone.getTimeZone("UTC"))
    return sdf.format(new Date())
}

def shortVersion = project.hasProperty('ver') ? project.ver.toString() : null

if (shortVersion == null || shortVersion.isEmpty()) {
    version = getTime() + "-SNAPSHOT"
} else if (shortVersion.contains("-RC-")) {
    version = shortVersion.substring(0, shortVersion.indexOf("-RC-")) + "-SNAPSHOT"
} else {
    version = shortVersion.startsWith("v")
            ? shortVersion.substring(1)
            : shortVersion
}

// -------------------- JAVA --------------------

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(21))
}

// -------------------- REPOSITORIES --------------------

repositories {
    mavenCentral()

    maven {
        name = "papermc"
        url = "https://repo.papermc.io/repository/maven-public/"
    }

    maven {
        name = "minecraft"
        url = "https://libraries.minecraft.net"
    }

    // ✔ Citizens NPC plugin repo (IMPORTANT for your custom character system)
    maven {
        name = "citizens"
        url = "https://maven.citizensnpcs.co/repo"
    }
}

// -------------------- DEPENDENCIES --------------------

dependencies {
    compileOnly "io.papermc.paper:paper-api:26.1.2.build.60-stable"

    // Citizens NPC system (for custom characters)
    compileOnly "net.citizensnpcs:citizens-main:2.0.33-SNAPSHOT"

    implementation "io.papermc:paperlib:1.0.8"

    compileOnly "com.github.spotbugs:spotbugs-annotations:4.9.8"

    spotbugsPlugins "com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0"

    testImplementation "io.papermc.paper:paper-api:26.1.2.build.60-stable"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
}

// -------------------- TEST --------------------

test {
    useJUnitPlatform()
}

// -------------------- RESOURCE PROCESSING --------------------

processResources {
    filesMatching("plugin.yml") {
        expand(
                NAME: rootProject.name,
                VERSION: version,
                PACKAGE: rootProject.group.toString()
        )
    }
}

// -------------------- CHECKSTYLE --------------------

checkstyle {
    toolVersion = "10.12.4"
    maxWarnings = 0
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = false
        html.required = true
    }
}

// -------------------- SPOTBUGS --------------------

tasks.withType(SpotBugsTask).configureEach {
    reports {
        html.required = true
        xml.required = false
    }
}

// -------------------- SHADOW JAR --------------------

shadowJar {
    archiveClassifier.set("")

    // Keep PaperLib relocation safe
    relocate "io.papermc.lib", "shadow.io.papermc.lib"

    minimize()
}

// Disable default jar
jar.enabled = false

build {
    dependsOn shadowJar
}

// -------------------- OPTIONAL TASKS --------------------

tasks.register("printProjectName") {
    doLast {
        println rootProject.name
    }
}

tasks.register("release") {
    dependsOn build

    doLast {
        if (!version.toString().endsWith("-SNAPSHOT")) {
            def jarFile = shadowJar.archiveFile.get().asFile
            def target = new File(
                    layout.buildDirectory.get().asFile,
                    "libs/${rootProject.name}.jar"
            )
            jarFile.renameTo(target)
        }
    }
}
