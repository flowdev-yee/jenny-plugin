import com.github.spotbugs.snom.SpotBugsTask
import java.text.SimpleDateFormat

plugins {
    id 'java'
    id 'checkstyle'
    id 'com.github.spotbugs' version '6.0.20' // Adjusted for better Java 8 compatibility
    id 'com.gradleup.shadow' version '8.3.0'
}

group = "com.crimsonwarpedcraft.exampleplugin"

// -------------------- VERSIONING --------------------

static def getTime() {
    SimpleDateFormat sdf = new SimpleDateFormat("yyMMdd-HHmm")
    sdf.setTimeZone(TimeZone.getTimeZone("UTC"))
    return sdf.format(new Date())
}

def shortVersion = project.hasProperty('ver') ? project.ver.toString() : null

if (shortVersion == null || shortVersion.isEmpty()) {
    version = getTime() + "-SNAPSHOT"
} else {
    version = shortVersion.startsWith("v") ? shortVersion.substring(1) : shortVersion
}

// -------------------- JAVA (CRITICAL FOR 1.12.2) --------------------

java {
    // 1.12.2 MUST be compiled with Java 8 for maximum compatibility
    toolchain.languageVersion.set(JavaLanguageVersion.of(8))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// -------------------- REPOSITORIES --------------------

repositories {
    mavenCentral()

    maven {
        name = "papermc"
        url = "https://repo.papermc.io/repository/maven-public/"
    }

    maven {
        name = "spigotmc-public"
        url = "https://hub.spigotmc.org/nexus/content/repositories/public/"
    }

    maven {
        name = "citizens"
        url = "https://maven.citizensnpcs.co/repo"
    }
}

// -------------------- DEPENDENCIES --------------------

dependencies {
    // Changed from 1.21 to 1.12.2
    compileOnly "org.spigotmc:spigot-api:1.12.2-R0.1-SNAPSHOT"

    // Citizens version for 1.12.2
    compileOnly "net.citizensnpcs:citizens-main:2.0.24-SNAPSHOT"

    implementation "io.papermc:paperlib:1.0.8"
    compileOnly "com.github.spotbugs:spotbugs-annotations:4.9.8"
    spotbugsPlugins "com.h3xstream.findsecbugs:findsecbugs-plugin:1.13.0"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
}

// -------------------- TEST --------------------

test {
    useJUnitPlatform()
}

// -------------------- RESOURCE PROCESSING --------------------

processResources {
    def props = [
            NAME: rootProject.name,
            VERSION: version,
            PACKAGE: group.toString()
    ]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching("plugin.yml") {
        expand props
    }
}

// -------------------- CHECKSTYLE --------------------

checkstyle {
    toolVersion = "10.12.4"
    maxWarnings = 0
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = false
        html.required = true
    }
}

// -------------------- SPOTBUGS --------------------

tasks.withType(SpotBugsTask).configureEach {
    reports {
        html.required = true
        xml.required = false
    }
}

// -------------------- SHADOW JAR --------------------

shadowJar {
    archiveClassifier.set("")
    relocate "io.papermc.lib", "crimsonwarpedcraft.libs.paperlib"
    minimize()
}

// Ensure build triggers shadowJar
jar.enabled = false
assemble.dependsOn shadowJar

// -------------------- RELEASE TASK --------------------

tasks.register("release") {
    dependsOn shadowJar
    doLast {
        println "Build Complete: ${shadowJar.archiveFile.get().asFile.name}"
    }
}
